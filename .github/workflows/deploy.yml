name: Portfolio CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'infra/**'

jobs:
  # JOB 1: Keamanan
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Trivy Vulnerability Scanner (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './infra'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'

  # JOB 2: Eksekusi Infrastruktur 
  deploy-to-local-container:
    needs: security-scan 
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Apply Infrastructure (Terraform)
        working-directory: ./infra
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Deploy Configuration (Ansible)
        working-directory: ./infra
        run: |
          ansible-playbook -i inventory.ini playbook.yml