name: Portfolio CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # JOB 1: Keamanan
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Trivy Vulnerability Scanner (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './infra'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'

  # JOB 2: Eksekusi Hybrid (Terraform -> Ansible -> K8s)
  deploy-hybrid-architecture:
    needs: security-scan
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: 1. Terraform - Membangun Satelit Database Eksternal
        working-directory: ./infra
        run: |
          # Hapus seluruh sisa memori dan brankas impostor di direktori ini
          rm -rf .terraform
          rm -f terraform.tfstate terraform.tfstate.backup
          
          # Inisialisasi dan jalankan murni menggunakan brankas aman
          terraform init
          terraform apply -auto-approve

      - name: 2. Ansible - Mengeksekusi Kubernetes Manifests
        working-directory: ./infra
        run: |
          ansible-playbook playbook-k8s.yml