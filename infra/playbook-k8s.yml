---
- name: Enterprise GitOps - Kubernetes Orchestration
  hosts: localhost
  connection: local
  tasks:
    - name: Membangun Website menjadi Docker Image Kustom
      shell: docker build -t portfolio-web:latest ../web/

    - name: Menyuntikkan Image ke dalam Klaster K3d
      shell: k3d image import portfolio-web:latest -c portfolio-cluster

    - name: Menerapkan Arsitektur K8s (Deployment, Service, Ingress)
      command: kubectl apply -f ../k8s/

    - name: Memastikan Seluruh Pod Web Berjalan Stabil
      command: kubectl rollout status deployment/portfolio-web